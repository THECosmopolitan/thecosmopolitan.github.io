<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="95" y1="0" x2="825" y2="1050">
      <stop stop-color="#f6ccd5" stop-opacity=".88"/>
      <stop offset=".22" stop-color="#ef94ab" stop-opacity=".5"/>
      <stop offset=".58" stop-color="#ef94ab" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ef94ab" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ray" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="580" y2="1000"><stop stop-color="#f6ccd5" stop-opacity=".86"/><stop offset=".3" stop-color="#f6ccd5" stop-opacity=".48"/><stop offset=".7" stop-color="#ef94ab" stop-opacity=".2"/><stop offset="1" stop-color="#ef94ab" stop-opacity="0"/></linearGradient>
    <radialGradient id="source"><stop stop-color="#f6ccd5" stop-opacity=".92"/><stop offset=".25" stop-color="#f6ccd5" stop-opacity=".6"/><stop offset=".62" stop-color="#ef94ab" stop-opacity=".16"/><stop offset="1" stop-color="#ef94ab" stop-opacity="0"/></radialGradient>
    <radialGradient id="ember"><stop stop-color="#ef94ab" stop-opacity=".11"/><stop offset="1" stop-color="#d90b19" stop-opacity="0"/></radialGradient>
    <filter id="light" x="-60%" y="-30%" width="220%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".007 .012" numOctaves="2" seed="18" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="27"/></filter>
    <filter id="smoke" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency=".006 .009" numOctaves="3" seed="18" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="180" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <!-- A soft expanding cone, aimed down and right from one off-frame source. -->
  <g filter="url(#light)">
    <path d="M-70-200 145-200 1230 1200 470 1200Z" fill="url(#beam)"/>
    <path d="M20-100 85-100 760 1150 510 1150Z" fill="url(#ray)"/>
    <ellipse cx="86" cy="-12" rx="235" ry="195" fill="url(#source)"/>
  </g>
  <g filter="url(#smoke)"><ellipse cx="340" cy="750" rx="440" ry="260" fill="url(#ember)"/><ellipse cx="830" cy="380" rx="580" ry="130" fill="url(#ember)" transform="rotate(-30 830 380)"/></g>
</svg>
